[package]
name = "clergy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "macOS daemon cache, DNS, and snapshot maintenance utility"
authors = ["Josh <you@fisidi.com>"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
crossbeam-channel = "0.5.15"
crossterm = "0.29.0"
dirs = "6.0.0"
rand = "0.9.2"
ratatui = "0.30.0"
signal-hook = "0.3"
unicode-width = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sysinfo = "0.38.0"

# Secure temp files for embedded shell backend
tempfile = "3.10"

# (UI deps will be added later)
