[package]
name = "clergy"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "macOS daemon cache, DNS, and snapshot maintenance utility"
authors = ["Josh <you@fisidi.com>"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
ratatui = "0.30.0"

# JSON contract
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Secure temp files for embedded shell backend
tempfile = "3.10"

# (UI deps will be added later)
